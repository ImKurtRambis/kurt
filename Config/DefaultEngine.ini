[/Script/Engine.RendererSettings]
; The realistic renderer. Every light in the game is placed at run time, so nothing is baked:
;   Lumen     - light bounces off walls, emissive neon and screens light what's near them, glossy floors reflect
;   Nanite    - every prop mesh (Tools\ImportProps.py); the engine's basic shapes that blocks are made of can't be
;   VSM       - virtual shadow maps: sharp, stable shadows from every movable light (blinds, chairs, people)
;   TSR       - temporal super resolution, the anti-aliasing Lumen and Nanite are made for
; The camera itself (exposure, focus, grain, vignette) is UHUFilmCamera. The colour grade is EA-08's.
r.AllowStaticLighting=False
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True
r.Lumen.TraceMeshSDFs=1
r.Shadow.Virtual.Enable=1
r.Nanite.ProjectEnabled=True
r.AntiAliasingMethod=4
; exposure stays in the legacy luminance units the lights were set up in (fixed at 1 here, the editor's view);
; in the game UHUFilmCamera lets the eye adapt a little around it
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=True

